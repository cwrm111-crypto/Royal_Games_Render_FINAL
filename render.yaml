services:
  - type: web
    name: royal-games-web
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:application --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: yes
    numInstances: 1
    envVars:
      - key: DATABASE_PATH
        value: data/royal_games.sqlite3
      - key: START_COINS
        value: "5000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: "*"
