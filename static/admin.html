<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Royal Admin</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white p-6"><div class="max-w-5xl mx-auto"><h1 class="text-3xl font-bold text-yellow-400">Royal Games Admin</h1><div id="login" class="mt-6"><input id="pass" type="password" class="p-3 text-black rounded" placeholder="Admin password"><button class="ml-2 px-4 py-3 bg-yellow-500 text-black rounded" onclick="login()">Login</button></div><pre id="out" class="mt-6 bg-slate-900 p-4 rounded-xl overflow-auto"></pre></div><script>let T=''; async function login(){let r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pass').value})});let x=await r.json();T=x.token||'';load()} async function load(){if(!T)return;let r=await fetch('/admin/stats',{headers:{Authorization:'Bearer '+T}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
